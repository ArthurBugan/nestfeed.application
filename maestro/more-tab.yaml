appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: More Tab Screen
# Tests the More tab screen content and navigation
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to More tab
- tapOn:
    text: "More"
- assertVisible:
    text: "More"

# Verify profile card
- assertVisible:
    text: "User"

# Verify menu items
- assertVisible:
    text: "Websites"
- assertVisible:
    text: "Share Links"
- assertVisible:
    text: "Groupshelf"
- assertVisible:
    text: "Blog"
- assertVisible:
    text: "Settings"

# Verify Sign Out button
- assertVisible:
    text: "Sign Out"

# Navigate to Websites from More
- tapOn:
    text: "Websites"
- assertVisible:
    text: "Websites"

# Navigate back to More
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "More"

# Navigate to Settings from More
- tapOn:
    text: "Settings"
- assertVisible:
    text: "Settings"

# Navigate back to More
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "More"
