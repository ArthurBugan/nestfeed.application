appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: Blog Navigation
# Tests navigating to the blog section
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to Blog from dashboard
- tapOn:
    text: "Blog"
- assertVisible:
    text: "Blog"
- assertVisible:
    text: "Blog Posts"

# Test search in blog
- tapOn:
    text: "Search blog posts..."
- inputText: "test"
- assertVisible:
    text: "test"
    optional: true

# Navigate back to dashboard
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Dashboard"
