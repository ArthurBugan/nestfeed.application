appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: Billing Screen
# Tests the billing/subscription screen
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to Settings
- tapOn:
    text: "Settings"
- assertVisible:
    text: "Settings"

# Navigate to Billing
- tapOn:
    text: "Billing"
- assertVisible:
    text: "Billing"

# Verify billing content
- assertVisible:
    text: "Current Plan"
- assertVisible:
    text: "Free Plan"
- assertVisible:
    text: "Basic features included"

# Verify plans section
- assertVisible:
    text: "Plans"

# Verify restore purchases option
- assertVisible:
    text: "Restore Purchases"

# Navigate back to settings
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Settings"

# Navigate back to dashboard
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Dashboard"
