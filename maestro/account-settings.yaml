appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: Account Settings
# Tests the account settings page navigation and content
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to Settings
- tapOn:
    text: "Settings"
- assertVisible:
    text: "Settings"

# Navigate to Account
- tapOn:
    text: "Account"
- assertVisible:
    text: "Account"

# Verify account-related elements
- assertVisible:
    text: "Personal Information"
- assertVisible:
    text: "Name"
- assertVisible:
    text: "Email"
- assertVisible:
    text: "Security"
- assertVisible:
    text: "Push Notifications"
- assertVisible:
    text: "Two-Factor Authentication"
- assertVisible:
    text: "Change Password"
- assertVisible:
    text: "Delete Account"

# Verify Save button
- assertVisible:
    text: "Save"

# Navigate back to settings
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Settings"

# Navigate back to dashboard
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Dashboard"
