appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: Create New Group
# Tests the complete group creation flow
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to Groups
- tapOn:
    text: "Groups"
- assertVisible:
    text: "Groups"

# Click New Group button
- tapOn:
    text: "+ New"
- assertVisible:
    text: "New Group"
- assertVisible:
    text: "Group Name"

# Fill in group details
- tapOn:
    text: "Group Name"
- inputText: "My Test Group"
- tapOn:
    text: "Description"
- inputText: "This is a test group created via E2E test"
- tapOn:
    text: "Category"
- inputText: "entertainment"

# Submit form
- tapOn:
    text: "Create"
    optional: true
- tapOn:
    text: "Save"
    optional: true
- assertVisible:
    text: "My Test Group"
    optional: true

# Navigate back to dashboard
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Dashboard"
