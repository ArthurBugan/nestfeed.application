appId: com.groupifyapp

---
# E2E Test: Reset Password Screen
# Tests the password reset form with validation
- launchApp:
    clearState: true

# Navigate to forgot password flow
- assertVisible:
    text: "Welcome Back"
- tapOn: "Forgot Password?"
- assertVisible:
    text: "Reset Password"

# Fill in email and submit
- tapOn:
    text: "Email"
- inputText: "test@example.com"
- tapOn: "Send Reset Link"
- waitForAnimationToEnd

# Verify success screen
- assertVisible:
    text: "Check Your Email"

# Navigate back to login
- tapOn: "Back to Sign In"
- assertVisible:
    text: "Welcome Back"

# Verify sign up link
- tapOn:
    text: "Don't have an account?"
- assertVisible:
    text: "Create Account"

# Navigate back to login
- tapOn:
    text: "Already have an account?"
- assertVisible:
    text: "Welcome Back"

# Verify social login buttons are visible
- assertVisible:
    text: "Sign in with Google"
- assertVisible:
    text: "Sign in with Discord"
- assertVisible:
    text: "Sign in with Apple"
