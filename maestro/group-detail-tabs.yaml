appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: Group Detail Tabs
# Tests the group detail view with its tabs
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to Groups
- tapOn:
    text: "Groups"
- assertVisible:
    text: "Groups"

# Tap on first group to open detail view
- tapOn:
    text: "Groups"
- assertVisible:
    text: "Overview"
    optional: true
- assertVisible:
    text: "Subgroups"
    optional: true
- assertVisible:
    text: "Settings"
    optional: true

# Navigate back to groups listing
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Groups"

# Navigate to dashboard
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Dashboard"
