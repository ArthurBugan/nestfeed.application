appId: com.groupifyapp

---
# E2E Test: Forgot Password Flow
# Tests the forgot password navigation and form
- launchApp:
    clearState: true

# Verify initial screen
- assertVisible:
    text: "Welcome Back"

# Navigate to forgot password
- tapOn: "Forgot Password?"
- assertVisible:
    text: "Reset Password"
- assertVisible:
    text: "Enter your email to receive reset instructions"

# Fill in email for password reset
- tapOn:
    text: "Email"
- inputText: "demo@demo.com"

# Submit forgot password
- tapOn: "Send Reset Link"
- assertVisible:
    text: "Sending..."
- waitForAnimationToEnd

# Should see success screen
- assertVisible:
    text: "Check Your Email"
- assertVisible:
    text: "demo@demo.com"

# Navigate back to login
- tapOn: "Back to Sign In"
- assertVisible:
    text: "Welcome Back"

# Verify back link from login
- tapOn: "Forgot Password?"
- assertVisible:
    text: "Reset Password"
- tapOn:
    text: "Back to Sign In"
- assertVisible:
    text: "Welcome Back"
