appId: com.groupifyapp

---
# E2E Test: Forgot Password Success Screen
# Tests the forgot password success page display and navigation
- launchApp:
    clearState: true

# Navigate to forgot password flow
- assertVisible:
    text: "Welcome Back"
- tapOn: "Forgot Password?"
- assertVisible:
    text: "Reset Password"

# Fill in email and submit
- tapOn:
    text: "Email"
- inputText: "testuser@example.com"
- tapOn: "Send Reset Link"
- waitForAnimationToEnd

# Verify success screen content
- assertVisible:
    text: "Check Your Email"
- assertVisible:
    text: "testuser@example.com"
- assertVisible:
    text: "We've sent reset instructions to"
- assertVisible:
    text: "Check your inbox and follow the instructions"

# Test back to sign in button
- tapOn: "Back to Sign In"
- assertVisible:
    text: "Welcome Back"

# Navigate back to forgot password again
- tapOn: "Forgot Password?"
- assertVisible:
    text: "Reset Password"

# Test "Try again" link
- tapOn:
    text: "Try again"
- assertVisible:
    text: "Reset Password"

# Navigate back to login
- tapOn:
    text: "Back to Sign In"
- assertVisible:
    text: "Welcome Back"
