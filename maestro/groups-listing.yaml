appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: Groups Navigation & Listing
# Tests navigating to groups and viewing the list
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to Groups from dashboard
- tapOn:
    text: "Groups"
- assertVisible:
    text: "Groups"
- assertVisible:
    text: "Search groups..."

# Verify the + New button exists
- assertVisible:
    text: "+ New"

# Test search functionality
- tapOn:
    text: "Search groups..."
- inputText: "test search"
- assertVisible:
    text: "test search"
    optional: true

# Clear search
- tapOn:
    id: "clear-search"
    optional: true
- assertVisible:
    text: "Groups"

# Navigate back to dashboard
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Dashboard"
