appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: Privacy Policy Screen
# Tests the privacy policy screen content and navigation
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to Settings
- tapOn:
    text: "Settings"
- assertVisible:
    text: "Settings"

# Navigate to Privacy
- tapOn:
    text: "Privacy"
- assertVisible:
    text: "Privacy Policy"

# Verify privacy content sections
- assertVisible:
    text: "Last updated: May 2025"
- assertVisible:
    text: "Data Collection"
- assertVisible:
    text: "Data Storage"
- assertVisible:
    text: "Your Rights"
- assertVisible:
    text: "Contact"

# Verify contact email is visible
- assertVisible:
    text: "support@nestfeed.app"

# Navigate back to settings
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Settings"

# Navigate back to dashboard
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Dashboard"
