appId: com.groupifyapp
env:
  TEST_EMAIL: "demo@demo.com"
  TEST_PASSWORD: "teste1234"

---
# E2E Test: Dark Mode Toggle
# Tests the dark mode appearance toggle
- launchApp:
    clearState: true

# Login first
- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "Email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Password"
- inputText: "${TEST_PASSWORD}"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible:
    text: "Dashboard"

# Navigate to Settings
- tapOn:
    text: "Settings"
- assertVisible:
    text: "Settings"

# Navigate to Appearance
- tapOn:
    text: "Appearance"
- assertVisible:
    text: "Appearance"

# Verify theme options are visible
- assertVisible:
    text: "Theme"
- assertVisible:
    text: "System"
- assertVisible:
    text: "Light"
- assertVisible:
    text: "Dark"

# Verify display options
- assertVisible:
    text: "Display"
- assertVisible:
    text: "Font Size"
- assertVisible:
    text: "Language"

# Verify accessibility options
- assertVisible:
    text: "Accessibility"
- assertVisible:
    text: "Animations"
- assertVisible:
    text: "Reduce Motion"

# Navigate back to settings
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Settings"

# Navigate back to dashboard
- swipe:
    direction: "down"
    speed: "fast"
- assertVisible:
    text: "Dashboard"
